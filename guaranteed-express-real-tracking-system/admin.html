<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Guaranteed Express Delivery Services</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#142238;font:14px system-ui,-apple-system,Segoe UI,sans-serif}header{background:#10233f;color:white}.bar,main{max-width:1100px;margin:auto;padding:20px 24px}.bar{display:flex;justify-content:space-between}.brand{font-weight:800}.logout,.back{color:white;text-decoration:none;cursor:pointer}.card{background:#fff;border:1px solid #dfe6ef;border-radius:14px;padding:24px;margin:20px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{width:100%;padding:10px;border:1px solid #d5deea;border-radius:8px;font:inherit}.field:focus{outline:2px solid #b9d3f7}.label{font-size:11px;color:#68768a;text-transform:uppercase;letter-spacing:.6px;display:block;margin-bottom:6px}.btn{border:0;border-radius:8px;padding:11px 17px;background:#1f6feb;color:#fff;font-weight:700;cursor:pointer}.danger{background:#b42318}.muted{color:#68768a}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.hidden{display:none}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px;border-bottom:1px solid #e4e9ef;text-align:left}.eventrow{border:1px solid #e0e6ee;border-radius:10px;padding:12px;margin:10px 0}.msg{padding:10px;border-radius:8px;background:#eef6ff;color:#1557a6;margin:10px 0}.error{background:#fff1f0;color:#a4231b}@media(max-width:700px){.grid{grid-template-columns:1fr}.table{font-size:12px}}
</style></head><body><header><div class="bar"><div class="brand">Guaranteed Express Delivery Services — Admin</div><a class="back" href="index.html">Customer tracker</a></div></header>
<main>
<section id="login" class="card"><h2>Admin sign in</h2><p class="muted">Use a Supabase Auth account that you have added to the admin_profiles table.</p>
<div class="grid"><div><label class="label">Email</label><input id="email" class="field" type="email"></div><div><label class="label">Password</label><input id="password" class="field" type="password"></div></div><button class="btn" style="margin-top:15px" onclick="login()">Sign in</button><div id="loginMsg"></div></section>
<section id="app" class="hidden"><div class="row"><h2>Shipments</h2><button class="btn" onclick="newShipment()">+ New shipment</button></div><div id="msg"></div><div class="card"><table class="table"><thead><tr><th>Tracking</th><th>Status</th><th>Destination</th><th>Updated</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
<div id="editor" class="card hidden"><h2 id="editorTitle">New shipment</h2><input type="hidden" id="id"><div class="grid">
<div><label class="label">Tracking number</label><input id="tracking_number" class="field"></div><div><label class="label">Status</label><select id="status" class="field"><option>PROCESSING</option><option>IN TRANSIT</option><option>OUT FOR DELIVERY</option><option>DELIVERED</option><option>DELAYED</option></select></div>
<div><label class="label">Estimated delivery</label><input id="estimated_delivery" class="field" type="date"></div><div><label class="label">Service</label><input id="service" class="field" value="Express Delivery"></div>
<div><label class="label">Weight</label><input id="weight" class="field"></div><div><label class="label">Origin</label><input id="origin" class="field"></div><div><label class="label">Destination</label><input id="destination" class="field"></div><div><label class="label">Sender</label><input id="sender_name" class="field"></div><div><label class="label">Recipient</label><input id="recipient_name" class="field"></div><div><label class="label">Package type</label><input id="package_type" class="field" value="Standard parcel"></div><div><label class="label">Reference</label><input id="reference" class="field"></div>
</div><h3>Tracking events</h3><div id="eventEditor"></div><button class="btn" onclick="addEvent()">+ Add event</button><div style="margin-top:18px"><button class="btn" onclick="saveShipment()">Save shipment</button> <button class="btn danger" onclick="deleteShipment()">Delete</button></div></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const sb=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_PUBLISHABLE_KEY);let events=[];
const fields=['tracking_number','status','estimated_delivery','service','weight','origin','destination','sender_name','recipient_name','package_type','reference'];
const $=id=>document.getElementById(id);
function msg(t,error=false){$('msg').innerHTML=t?`<div class="msg ${error?'error':''}">${t}</div>`:''}
async function login(){const {data,error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){$('loginMsg').innerHTML='<div class="msg error">'+error.message+'</div>';return}await boot()}
async function boot(){const {data:{user}}=await sb.auth.getUser();if(!user)return;const {data:p}=await sb.from('admin_profiles').select('role').eq('user_id',user.id).maybeSingle();if(!p){await sb.auth.signOut();$('loginMsg').innerHTML='<div class="msg error">This account is not authorized as an administrator.</div>';return}$('login').classList.add('hidden');$('app').classList.remove('hidden');load()}
async function load(){const {data,error}=await sb.from('shipments').select('*').order('updated_at',{ascending:false});if(error){msg(error.message,true);return}$('rows').innerHTML=(data||[]).map(s=>`<tr><td>${esc(s.tracking_number)}</td><td>${esc(s.status)}</td><td>${esc(s.destination||'—')}</td><td>${new Date(s.updated_at).toLocaleString()}</td><td><button class="btn" onclick="editShipment('${s.id}')">Edit</button></td></tr>`).join('')||'<tr><td colspan="5">No shipments yet.</td></tr>'}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function newShipment(){clearEditor();$('editorTitle').textContent='New shipment';$('editor').classList.remove('hidden')}
async function editShipment(id){const {data,error}=await sb.from('shipments').select('*').eq('id',id).single();if(error){msg(error.message,true);return}fields.forEach(k=>$(k).value=data[k]??'');$('id').value=id;const {data:ev}=await sb.from('tracking_events').select('*').eq('shipment_id',id).order('event_time',{ascending:false});events=ev||[];renderEvents();$('editorTitle').textContent='Edit '+data.tracking_number;$('editor').classList.remove('hidden')}
function clearEditor(){fields.forEach(k=>$(k).value='');$('status').value='PROCESSING';$('service').value='Express Delivery';$('package_type').value='Standard parcel';$('id').value='';events=[];renderEvents()}
function renderEvents(){$('eventEditor').innerHTML=events.map((e,i)=>`<div class="eventrow"><div class="grid"><div><label class="label">Status</label><input class="field" data-i="${i}" data-k="status" value="${esc(e.status||'')}"></div><div><label class="label">Location</label><input class="field" data-i="${i}" data-k="location" value="${esc(e.location||'')}"></div><div><label class="label">Message</label><input class="field" data-i="${i}" data-k="message" value="${esc(e.message||'')}"></div><div><label class="label">Date/time</label><input class="field" data-i="${i}" data-k="event_time" type="datetime-local" value="${e.event_time?new Date(e.event_time).toISOString().slice(0,16):''}"></div></div></div>`).join('')}
function addEvent(){events.push({status:$('status').value,message:'',location:'',event_time:new Date().toISOString()});renderEvents()}
function collectEvents(){document.querySelectorAll('#eventEditor [data-i]').forEach(el=>{events[+el.dataset.i][el.dataset.k]=el.value});return events}
async function saveShipment(){collectEvents();const payload={};fields.forEach(k=>payload[k]=$(k).value||null);if(!payload.tracking_number){msg('Tracking number is required.',true);return}let id=$('id').value, result;if(id)result=await sb.from('shipments').update(payload).eq('id',id).select().single();else result=await sb.from('shipments').insert(payload).select().single();if(result.error){msg(result.error.message,true);return}id=result.data.id;await sb.from('tracking_events').delete().eq('shipment_id',id);if(events.length){const rows=events.map(e=>({shipment_id:id,status:e.status||payload.status,message:e.message||'',location:e.location||'',event_time:e.event_time||new Date().toISOString()}));const r=await sb.from('tracking_events').insert(rows);if(r.error){msg(r.error.message,true);return}}msg('Shipment saved.');$('id').value=id;await load()}
async function deleteShipment(){const id=$('id').value;if(!id)return;if(!confirm('Delete this shipment and its tracking history?'))return;const {error}=await sb.from('shipments').delete().eq('id',id);if(error){msg(error.message,true);return}$('editor').classList.add('hidden');msg('Shipment deleted.');load()}
sb.auth.getSession().then(({data})=>{if(data.session)boot()});
</script></body></html>
